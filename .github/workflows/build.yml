# cyan 三平台打包：tag 推送或手动触发，一次性产出 mac/linux/windows 的 zip
# 产物在 Actions 运行页面的 Artifacts 下载（cyan-<平台>），也可发 Release
name: build

on:
  workflow_dispatch: {}          # 手动触发
  push:
    tags: ["v*"]                 # 推送 v1.2.3 这类 tag 自动触发

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: mac
          - os: ubuntu-22.04
            name: linux
          - os: windows-latest
            name: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      # Linux 需要 webkit2gtk-4.1 等系统库（Tauri v2 依赖）
      - name: Install Linux system deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev \
            libfuse2

      - name: Build (bash)
        working-directory: app
        shell: bash
        run: ./build.sh --ci

      # 统一上传本平台 zip（build.sh 已收集到 bin/）
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cyan-${{ matrix.name }}
          path: |
            bin/*.zip
            bin/*.dmg
            bin/*.AppImage
          if-no-files-found: error
