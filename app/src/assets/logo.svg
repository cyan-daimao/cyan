<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#3aa8ff"/>
    </linearGradient>
  </defs>
  <!-- 单圆 + 内圈"屏幕"：双层结构（像机器人头戴屏幕） -->
  <circle cx="64" cy="64" r="56" fill="url(#g)"/>
  <!-- 眼睛：两个白色圆点 -->
  <circle cx="52" cy="48" r="4" fill="#ffffff"/>
  <circle cx="76" cy="48" r="4" fill="#ffffff"/>
  <!-- 内圈屏幕（长条形 64×22，整体上移一点） -->
  <rect x="32" y="76" width="64" height="22" rx="4" fill="#0f172a" opacity="0.28"/>
  <!-- >  __ 在屏幕里居中 -->
  <path
    d="M 44 83 L 51 87 L 44 91"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <line x1="57" y1="91" x2="61" y2="91" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="67" y1="91" x2="71" y2="91" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
