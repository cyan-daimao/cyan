<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00c9a7"/>
      <stop offset="100%" stop-color="#3aa8ff"/>
    </linearGradient>
  </defs>
  <!-- 圆角方形机器人头 -->
  <rect x="8" y="8" width="112" height="112" rx="28" fill="url(#g)"/>
  <!-- 眼睛：两个白色圆点（上移一点） -->
  <circle cx="52" cy="47" r="4" fill="#ffffff"/>
  <circle cx="76" cy="47" r="4" fill="#ffffff"/>
  <!-- 内圈屏幕（长条形 64×22，整体下移一点，让眼睛和屏幕间距更大） -->
  <rect x="32" y="78" width="64" height="22" rx="4" fill="#0f172a" opacity="0.28"/>
  <!-- >  __ 在屏幕里居中 -->
  <path
    d="M 44 85 L 51 89 L 44 93"
    stroke="#ffffff"
    stroke-width="2.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    fill="none"
  />
  <line x1="57" y1="93" x2="61" y2="93" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="65" y1="93" x2="69" y2="93" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="73" y1="93" x2="77" y2="93" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
</svg>
